[project]
name = "efficient-nn"
version = "0.1.0"
description = "Coursework: analytical performance model of a small CNN"
requires-python = ">=3.14,<3.15"
dependencies = [
    "ipykernel>=7.0.0",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "nvidia-ml-py>=13.0.0",
    "pandas>=2.2.0",
    "scipy>=1.15.0",
    "torch>=2.14.0",
    "tqdm>=4.67.0",
]

[dependency-groups]
dev = ["ruff>=0.15.0"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
preview = true
select = ["E4", "E7", "E9", "F", "PLR1702"]

[tool.ruff.lint.pylint]
max-nested-blocks = 5
